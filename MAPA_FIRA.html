<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BeUnifyT · Mapa Gran Via</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--f:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;--bg:#e9eef3;--panel:#fff;--panel2:#f4f7fa;--line:#cfd9e3;--line2:#7d90a3;--ink:#0f2233;--mute:#4a5e72;--acc:#0b6e8a;--on:#fff;
 --prog:#56677a;--park:#a14a06;--door:#1d4ed8;--fin:#047857;--warn:#b42318;--early:#0f766e;--road:#dfe5ec;--hall:#fbfcfd;--r:4px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);font-weight:600;white-space:nowrap;line-height:1}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.d{color:var(--warn);border-color:var(--warn)}
.btn.q{border-color:transparent;background:transparent}
.btn.sm{min-height:30px;padding:0 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.in{min-height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mute);min-width:0}
.mono{font-family:var(--fm)}
.mute{color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-prog{color:var(--prog)}.c-park{color:var(--park)}.c-door{color:var(--door)}.c-fin{color:var(--fin)}.c-warn{color:var(--warn)}.c-early{color:var(--early)}
.tag{font-size:12px;font-weight:700;padding:1px 6px;border-radius:3px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#14532d}.t-early{background:#ccfbf1;color:#134e4a}.t-late{background:#fee2e2;color:#7f1d1d}.t-wait{background:#fef3c7;color:#78350f}

/* layout */
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:var(--ink);color:#fff}
header .brand{font-weight:700;letter-spacing:-.01em;font-size:16px;margin-right:6px}
header .brand span{font-weight:500;opacity:.75}
header .btn{background:transparent;color:#fff;border-color:#4b6278}
header .btn.p{background:#ffb703;color:#1b1203;border-color:#ffb703}
header .btn[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.clock{font-family:var(--fm);font-size:20px;font-weight:600}
.sim{font-size:12px;font-weight:700;color:#ffb703}
.sp{flex:1}
.seg{display:inline-flex;gap:3px}
.map{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg);touch-action:none}
.map svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:38px;padding:0;background:var(--panel)}
.legend{position:absolute;left:12px;top:10px;display:flex;flex-wrap:wrap;gap:8px;background:var(--panel);padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);font-size:12px;max-width:calc(100% - 24px)}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:12px;height:12px;border-radius:2px;display:inline-block;border:1.5px solid}
.hint{position:absolute;left:12px;top:48px;z-index:2;background:#fff7d6;border:1px solid #e6c34a;padding:8px 12px;border-radius:var(--r);font-size:13px;font-weight:600;max-width:min(520px,calc(100% - 80px))}
aside{grid-row:2/4;grid-column:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:56px}
.ph h2{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{flex:1;overflow:auto;padding:12px 14px;display:grid;gap:10px;align-content:start}
.sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.k{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--panel2);text-align:left}
.k b{display:block;font-family:var(--fm);font-size:22px}
.k span{font-size:12px;color:var(--mute);font-weight:600}
.al{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r);padding:8px 10px;display:grid;gap:6px;background:var(--panel)}
.al.early{border-left-color:var(--early)}.al.park{border-left-color:var(--park)}
.al .t{font-weight:700;font-size:13px}
.al .acts{display:flex;flex-wrap:wrap;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left;width:100%}
.row .mono{font-size:15px;font-weight:600}
.row .s{grid-column:1/-1;font-size:12px;color:var(--mute)}
.row.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
dl.d{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;font-size:13px}
dl.d dt{color:var(--mute)}dl.d dd{margin:0;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.durs{display:flex;flex-wrap:wrap;gap:4px}
.durs button{min-height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);font-weight:600}
.durs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--door)}
.bar.over i{background:var(--warn)}
/* gantt */
.gantt{grid-column:1;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:34dvh}
.gh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.gh b{font-size:13px}
.gh select{width:auto;min-height:30px}
.gb{overflow:auto;flex:1}
.gb svg{display:block;width:100%}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
/* svg */
.road{fill:none;stroke:var(--road);stroke-width:30;stroke-linejoin:round}
.walk{fill:none;stroke:#c9d3dd;stroke-width:34;opacity:.85}
.rb{fill:#eef2f6;stroke:#d6dee7;cursor:pointer}
.rb.ov{fill:rgba(255,255,255,0);stroke:none}
.rb.ov.sel{fill:rgba(255,183,3,.18);stroke:#ffb703;stroke-width:4}
.rb.sel{fill:#dff3f8;stroke:var(--acc);stroke-width:2}
.rbt{font-family:var(--fm);font-size:10px;fill:var(--mute)}
.hall rect{fill:var(--hall);stroke:#9fb0c1;stroke-width:1.5}
.hall text{font-family:var(--fm);font-weight:600;fill:#c3ced9}
.slot{cursor:pointer}
.slot rect{stroke-width:1.2}
.s-free rect{fill:#fff;stroke:#9aa9b8}
.s-soon rect{fill:#fff;stroke:var(--park);stroke-width:2}
.s-busy rect{fill:var(--door);stroke:var(--door)}
.s-over rect{fill:var(--warn);stroke:var(--warn)}
.s-early rect{fill:#ccfbf1;stroke:var(--early);stroke-width:2}
.slot.sel rect{stroke:#ffb703;stroke-width:3}
.did{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:-.3px;fill:var(--ink);pointer-events:none}
.s-busy .did,.s-over .did{fill:#fff}
svg[data-z="lo"] .did{display:none}
.route{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 7;opacity:.9}
.route.in{stroke:#16a34a}.route.out{stroke:#dc2626}
.park polygon{fill:rgba(161,74,6,.12);stroke:var(--park);stroke-width:2;stroke-dasharray:6 4;cursor:pointer}
.park.full polygon{fill:rgba(180,35,24,.18);stroke:var(--warn)}
.park text{font-family:var(--fm);font-size:20px;font-weight:600;fill:var(--ink);pointer-events:none}
.acc circle{stroke:#fff;stroke-width:3;cursor:pointer}
.acc text{font-family:var(--fm);font-weight:700;fill:#fff;font-size:20px;pointer-events:none}
.acc .lb{fill:var(--ink);font-size:17px;paint-order:stroke;stroke:#fff;stroke-width:4px}
.edit .slot,.edit .park polygon,.edit .acc circle{cursor:move}
.handle{fill:#ffb703;stroke:#fff;stroke-width:2;cursor:move}
@media (max-width:980px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 56dvh auto auto;height:auto;min-height:100dvh}
 aside{grid-row:4;grid-column:1;border-left:0;border-top:1px solid var(--line)}
 .gantt{grid-row:3;max-height:none}
 .legend{display:none}
 header .brand span{display:none}
 header .sp{display:none}
}
@media print{header,.zoom,.legend,aside .acts{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand">BeUnifyT <span>· Gran Via · rampas y puertas</span></div>
  <span class="clock" id="clock">--:--</span><span class="sim" id="sim"></span>
  <span class="seg" role="group" aria-label="Simular tiempo"><button class="btn sm" data-sim="5">+5′</button><button class="btn sm" data-sim="15">+15′</button><button class="btn sm" data-sim="0">Ahora</button></span>
  <span class="sp"></span>
  <span class="seg" role="group" aria-label="Modo"><button class="btn sm" data-mode="op" aria-pressed="true">Operar</button><button class="btn sm" data-mode="cfg" aria-pressed="false">Configurar plano</button></span>
  <button class="btn sm" id="imp">Importar de BeUnifyT</button>
  <button class="btn sm p" id="newb">+ Reserva</button>
</header>
<section class="map" id="map"><svg id="svg" viewBox="0 0 2370 1710" aria-label="Plano Fira Gran Via"></svg>
  <div class="zoom"><button class="btn" data-z="in" aria-label="Acercar">+</button><button class="btn" data-z="out" aria-label="Alejar">−</button><button class="btn" data-z="fit" aria-label="Ver todo">⤢</button></div>
  <div class="legend"><span class="lg"><i style="background:#fff;border-color:#9aa9b8"></i>Libre</span><span class="lg"><i style="background:#fff;border-color:var(--park)"></i>Llega en 30′</span><span class="lg"><i style="background:var(--door);border-color:var(--door)"></i>Descargando</span><span class="lg"><i style="background:var(--warn);border-color:var(--warn)"></i>Excedido</span><span class="lg"><i style="background:#ccfbf1;border-color:var(--early)"></i>Libre antes de hora</span><span class="lg"><i style="background:none;border:0;border-top:3px dashed #16a34a;border-radius:0;height:0"></i>Entrada</span><span class="lg"><i style="background:none;border:0;border-top:3px dashed #dc2626;border-radius:0;height:0"></i>Salida</span></div>
  <div class="hint" id="hint" hidden></div>
</section>
<aside id="side"></aside>
<section class="gantt"><div class="gh"><b>Planificación</b><select class="in" id="gsel" aria-label="Rambla"></select><span class="mute" style="font-size:12px">Pulsa una fila vacía para reservar a esa hora · barra = reserva</span></div><div class="gb" id="gb"></div></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fimg" accept="image/*" hidden><input type="file" id="fjson" accept="application/json,.json" hidden>

<script>
"use strict";
/* =========================================================
   MAPA FIRA GRAN VIA · BeUnifyT
   Planificador de puertas/rampas con slots de tiempo.
   Datos propios en localStorage (bu_mapa_layout_v1, bu_mapa_plan_v1).
   Lee (sin modificar) los datos de BeUnifyT en localStorage 'cu1_local'.
   ========================================================= */
const KL='bu_mapa_layout_v2',KP='bu_mapa_plan_v1',SRC='cu1_local',M=60000;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const normP=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
let OFF=0;const now=()=>Date.now()+OFF;
const hhmm=t=>t?new Date(t).toTimeString().slice(0,5):'—';
const mm=x=>Math.round(x/M);
let tT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------------- plano oficial: "Loading Bays - Gran Via" (Fira Barcelona, nov 2025) ----------------
   Coordenadas en píxeles de la imagen del plano (2370x1710). Ramblas A–L según la nomenclatura oficial. */
const VW=2370,VH=1710,KF=1.185;
const V=(x,y)=>[Math.round(x*KF),Math.round(y*KF)];
function defLayout(){
  const R4=(id,label,x0,y0,x1,y1)=>{const a=V(x0,y0),b=V(x1,y1);return{id,label,x:a[0],y:a[1],w:b[0]-a[0],h:b[1]-a[1]}};
  const H=[R4('1','1',385,770,580,1160),R4('2','2',620,450,790,1210),R4('3','3',860,355,1065,1215),R4('5','5',1155,350,1330,735),R4('7','7',1375,350,1555,735),R4('4','4',1155,805,1330,1230),R4('6','6',1375,805,1555,1230),R4('8b','8.1',1670,920,1965,1110)];
  const doors=[];
  function gen(hid,side,pre,n0,cnt,fix,a,b,yfn){for(let i=0;i<cnt;i++){const t=a+(b-a)*(cnt===1?.5:i/(cnt-1));
    let x,y;if(side==='W'||side==='E'){x=fix;y=t}else{x=t;y=yfn?yfn(t):fix}const q=V(x,y);doors.push({id:pre+'.'+(n0+i),hall:hid,side,x:q[0],y:q[1]})}}
  const iBottom=x=>450-(x-637)*(450-312)/(1075-637);
  gen('1','E','1',1,6,580,800,1140);
  gen('2','W','2',1,8,620,1190,470);gen('2','E','2',9,6,790,470,1005);
  gen('3','W','3',1,6,860,1005,420);gen('3','N','3',7,4,0,895,1035,x=>iBottom(x)+2);gen('3','E','3',11,4,1065,370,635);gen('3','E','3',15,6,1065,910,1205);
  gen('5','W','5',1,4,1155,375,640);gen('5','N','5',5,3,350,1185,1300);gen('5','E','5',8,4,1330,375,715);
  gen('7','W','7',1,4,1375,375,715);gen('7','N','7',5,3,350,1405,1525);gen('7','E','7',8,4,1555,375,715);
  gen('4','W','4',1,4,1155,910,1210);gen('4','E','4',5,4,1330,840,1195);gen('4','S','4',9,2,1230,1190,1300);
  gen('6','W','6',1,4,1375,840,1195);gen('6','E','6',5,4,1555,840,1210);gen('6','S','6',9,2,1230,1415,1525);
  gen('8b','N','8',1,6,920,1700,1935);
  const A=[['1',520,1300,true,false],['2',640,395,false,true],['3',1090,272,false,true],['4',1100,1300,true,true],['5',1580,1300,true,true]].map(a=>{const q=V(a[1],a[2]);return{id:a[0],x:q[0],y:q[1],inn:a[3],out:a[4]}});
  const P=[{id:'P21',name:'Triángulo 2.1 (A)',pts:[[487,1165],[572,1165],[572,1262],[530,1262]].map(p=>V(p[0],p[1])),cap:10},
           {id:'P317',name:'Triángulo 3.17',pts:[[1075,1180],[1148,1180],[1148,1232]].map(p=>V(p[0],p[1])),cap:10},
           {id:'SOT',name:'SOT del Migdia (externo)',pts:[[1640,1300],[1960,1300],[1960,1360],[1640,1360]].map(p=>V(p[0],p[1])),cap:60}];
  const rr=(id,name,x0,y0,x1,y1,i,o,pk,pts,poly)=>{const a=V(x0,y0),b=V(x1,y1);return{id,name,x:a[0],y:a[1],w:b[0]-a[0],h:b[1]-a[1],poly:poly?poly.map(p=>V(p[0],p[1])):null,inAcc:i,outAcc:o,park:pk,pts:pts.map(p=>V(p[0],p[1]))}};
  const R=[
   rr('B','B · Rambla 1-2',580,408,617,1268,'1','2','P21',[[520,1300],[598,1290],[598,420],[640,395]]),
   rr('C','C · Rambla 2-3',790,397,860,1030,'4','2','P21',[[1100,1300],[1100,1250],[828,1250],[828,405],[700,420],[640,395]]),
   rr('D','D · Rambla 3-4',1065,893,1155,1235,'4','5','P317',[[1100,1300],[1110,1250],[1110,900],[1110,1250],[1565,1250],[1580,1300]]),
   rr('E','E · Rambla 3-5',1065,323,1155,652,'5','3','P317',[[1580,1300],[1568,1250],[1568,330],[1110,330],[1110,640],[1110,330],[1090,272]]),
   rr('F','F · Rambla 4-6',1328,830,1377,1205,'5','5','SOT',[[1580,1300],[1568,1250],[1352,1250],[1352,840],[1352,1250],[1568,1250],[1580,1300]]),
   rr('G','G · Rambla 5-7',1328,350,1377,730,'5','3','SOT',[[1580,1300],[1568,1250],[1568,330],[1352,330],[1352,725],[1352,330],[1110,330],[1090,272]]),
   rr('H','H · Rambla 7-8 / 6-8',1552,312,1582,1258,'5','5','SOT',[[1580,1300],[1568,1250],[1568,330],[1568,1250],[1580,1300]]),
   rr('I','I · X2.2 y X3.2',625,255,1078,452,'1','3','P21',[[520,1300],[598,1290],[598,420],[640,425],[1060,290],[1090,272]],[[625,390],[1060,255],[1078,315],[637,452]]),
   rr('J','J · X5 y X7',1155,310,1550,350,'5','3','SOT',[[1580,1300],[1568,1250],[1568,330],[1160,330],[1110,300],[1090,272]]),
   rr('K','K · X2.1, X3.1, X4, X6',625,1230,1552,1264,'4','5','P317',[[1100,1300],[1100,1250],[640,1250],[1100,1250],[1565,1250],[1580,1300]]),
   rr('L','L · X8',1612,893,1982,924,'5','5','SOT',[[1580,1300],[1600,900],[1800,908],[1600,900],[1580,1300]]),
  ];

/* ---------------- geometría ---------------- */
function slotRect(d){const w=24,h=20;switch(d.side){case'W':return{x:d.x-w-1,y:d.y-h/2,w,h};case'E':return{x:d.x+1,y:d.y-h/2,w,h};case'N':return{x:d.x-h/2,y:d.y-w-1,w:h,h:w};default:return{x:d.x-h/2,y:d.y+1,w:h,h:w}}}
function slotC(d){const r=slotRect(d);return[r.x+r.w/2,r.y+r.h/2]}
function inPoly(p,q){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){const a=q[i],b=q[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
const inR=(p,r)=>r.poly?inPoly(p,r.poly):p[0]>=r.x&&p[0]<=r.x+r.w&&p[1]>=r.y&&p[1]<=r.y+r.h;
function ramblaOf(d){const c=slotC(d);return L.ramblas.find(r=>inR(c,r))||null}
const doorById=id=>L.doors.find(d=>d.id===id);
const parkById=id=>L.parks.find(p=>p.id===id);
const ramById=id=>L.ramblas.find(r=>r.id===id);
const accById=id=>L.acc.find(a=>a.id===id);
function doorsOfR(r){return L.doors.filter(d=>{const x=ramblaOf(d);return x&&x.id===r.id}).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}))}
function centroid(pts){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1]});return[x/pts.length,y/pts.length]}

/* proyección en cascada por puerta: inicio/fin previstos y retraso arrastrado */
function project(doorId){
  const out={};let prevEnd=-Infinity;const n=now();
  bkOfDoor(doorId).forEach(b=>{
    if(b.st==='fin'){out[b.id]={ps:b.tStart||b.start,pe:b.tEnd,delay:0};return}
    let ps,pe;
    if(b.st==='puerta'){ps=b.tStart;pe=Math.max(b.tStart+b.dur*M,n)}
    else{ps=Math.max(b.start,prevEnd,b.st==='prog'?b.start:n>b.start?n:b.start);pe=ps+b.dur*M}
    prevEnd=Math.max(prevEnd,pe);out[b.id]={ps,pe,delay:Math.max(0,mm(ps-b.start))};
  });
  return out;
}
function doorState(d){
  const c=cur(d.id),n=now();
  if(c)return n>c.tStart+c.dur*M?'over':'busy';
  const lastFin=bkOfDoor(d.id).filter(b=>b.st==='fin'&&b.early>0&&b.tStart+b.dur*M>n).pop();
  if(lastFin)return'early';
  const nx=bkOfDoor(d.id).find(b=>active(b)&&b.start>=n-L.tol*M);
  if(nx&&nx.start-n<=30*M)return'soon';
  return'free';
}
function arrTag(b){const tol=L.tol;
  if(b.tArr){const d=mm(b.tArr-b.start);return d<-tol?['t-early','Llegó '+(-d)+'′ antes']:d>tol?['t-late','Llegó '+d+'′ tarde']:['t-ok','Puntual']}
  const late=mm(now()-b.start);if(b.st==='prog'&&late>tol)return['t-late','Sin llegar +'+late+'′'];return null}
function doorTag(b){
  if(b.st==='puerta'){const r=mm(b.tStart+b.dur*M-now());return r>=0?['t-ok','Quedan '+r+'′']:['t-late','Excede '+(-r)+'′']}
  if(b.st==='fin'&&b.tStart){const d=mm(b.tEnd-(b.tStart+b.dur*M));return d<-1?['t-early','Terminó '+(-d)+'′ antes']:d>1?['t-late','Terminó '+d+'′ tarde']:['t-ok','En tiempo']}
  return null}
const T=t=>t?'<span class="tag '+t[0]+'">'+t[1]+'</span>':'';
const STN={prog:'Programado',parking:'En parking',puerta:'En puerta',fin:'Finalizado',cancel:'Cancelado'};
const STC={prog:'c-prog',parking:'c-park',puerta:'c-door',fin:'c-fin',cancel:'c-prog'};

/* ---------------- acciones ---------------- */
function rOfBk(b){const d=doorById(b.door);return d?ramblaOf(d):null}
function arrive(id){const b=PL.bk.find(x=>x.id===id);if(!b)return;const r=rOfBk(b);let pid=r&&r.park||'SOT';const p=parkById(pid);
  if(p&&parkCount(pid)>=p.cap){const alt=L.parks.find(q=>q.id!==pid&&parkCount(q.id)<q.cap);if(!alt){toast('Todos los parkings están llenos');return}toast(p.name+' lleno ('+p.cap+') → '+alt.name);pid=alt.id}
  b.st='parking';b.tArr=now();b.park=pid;log(b.mat+' llega · '+(parkById(pid)||{}).name);commit()}
function toDoor(id,doorId){const b=PL.bk.find(x=>x.id===id);if(!b)return;const dId=doorId||b.door;const c=cur(dId);
  if(c&&c.id!==b.id){toast('Puerta '+dId+' ocupada por '+c.mat);return}
  if(doorId&&doorId!==b.door){log(b.mat+' cambia '+b.door+' → '+doorId);b.door=doorId}
  if(!b.tArr)b.tArr=now();b.st='puerta';b.tStart=now();b.park=null;log(b.mat+' entra a puerta '+b.door);commit()}
function finish(id){const b=PL.bk.find(x=>x.id===id);if(!b)return;b.st='fin';b.tEnd=now();const gap=mm(b.tStart+b.dur*M-b.tEnd);b.early=gap>1?gap:0;
  log(b.mat+' termina en '+b.door+(gap>1?' · '+gap+'′ antes':gap<-1?' · '+(-gap)+'′ tarde':''));commit();
  if(gap>1){sel={k:'door',id:b.door};renderSide();toast('Puerta '+b.door+' libre '+gap+'′ antes: elige qué adelantar')}}
function extend(id,m){const b=PL.bk.find(x=>x.id===id);if(!b)return;b.dur+=m;log(b.mat+' amplía +'+m+'′');commit()}
function cancel(id){const b=PL.bk.find(x=>x.id===id);if(!b||!confirm('¿Cancelar la reserva de '+b.mat+'?'))return;b.st='cancel';log(b.mat+' cancelado');commit()}
/* candidatos para ocupar el hueco de una puerta que se libera antes */
function candidates(doorId){const d=doorById(doorId),r=ramblaOf(d);const n=now();
  const same=bkOfDoor(doorId).filter(b=>b.st==='parking'||b.st==='prog'&&b.start>n);
  const rm=r?PL.bk.filter(b=>b.st==='parking'&&b.door!==doorId&&(()=>{const x=rOfBk(b);return x&&x.id===r.id})()):[];
  const list=[...same.filter(b=>b.st==='parking'),...rm,...same.filter(b=>b.st==='prog')];
  const seen={};return list.filter(b=>!seen[b.id]&&(seen[b.id]=1)).slice(0,6)}
function nextFree(doorId,from,dur){let t=from;const pr=project(doorId);
  const bl=bkOfDoor(doorId).filter(active).map(b=>[pr[b.id].ps,pr[b.id].pe]).sort((a,b)=>a[0]-b[0]);
  for(const [s,e] of bl){if(t+dur*M<=s)return t;if(e>t)t=e}return t}
function addBk(o){const b=Object.assign({id:uid(),st:'prog',tArr:null,tStart:null,tEnd:null,park:null,src:'manual'},o);b.mat=normP(b.mat);PL.bk.push(b);log(b.mat+' reservado '+b.door+' '+hhmm(b.start)+' · '+b.dur+'′');commit();return b}

/* ---------------- estado de UI ---------------- */
let sel=null;       // {k:'door'|'park'|'bk'|'ram'|'acc'|'new'|'cfg'...,id}
let MODE='op',TOOL='move',draft=[];
let VB={x:0,y:0,w:VW,h:VH};
let gR='C';

/* ---------------- render mapa ---------------- */
function rMap(){
  const s=[],ed=MODE==='cfg';
  if(L.bg.img)s.push('<image href="'+(L.bg.img==='default'?PLAN:L.bg.img)+'" x="'+L.bg.x+'" y="'+L.bg.y+'" width="'+L.bg.w+'" height="'+L.bg.h+'" opacity="'+L.bg.op+'" preserveAspectRatio="none"/>');
  const sch=L.bg.schema||!L.bg.img;
  L.ramblas.forEach(r=>{const on=sel&&sel.k==='ram'&&sel.id===r.id||gR===r.id&&!sel;const cl='rb'+(sch?'':' ov')+(on?' sel':'');
    s.push(r.poly?'<polygon class="'+cl+'" data-k="ram" data-id="'+r.id+'" points="'+r.poly.map(q=>q.join(',')).join(' ')+'"/>':'<rect class="'+cl+'" data-k="ram" data-id="'+r.id+'" x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'"/>')});
  if(sch){
    s.push('');
    L.halls.forEach(h=>s.push('<g class="hall"><rect x="'+h.x+'" y="'+h.y+'" width="'+h.w+'" height="'+h.h+'" rx="2"/><text x="'+(h.x+h.w/2)+'" y="'+(h.y+h.h/2+Math.min(h.w,h.h)*.18)+'" text-anchor="middle" font-size="'+Math.min(110,Math.min(h.w,h.h)*.55)+'">'+esc(h.label)+'</text></g>'));
    if(false)L.ramblas.forEach(r=>{const v=r.h>r.w;s.push('<text class="rbt" x="'+(r.x+r.w/2)+'" y="'+(r.y+r.h/2)+'" text-anchor="middle" '+(v?'transform="rotate(-90 '+(r.x+r.w/2)+' '+(r.y+r.h/2)+')"':'')+'>'+esc(r.name.toUpperCase())+'</text>')});
  }
  // ruta resaltada
  const R=sel&&sel.k==='ram'?ramById(sel.id):sel&&sel.k==='bk'?rOfBk(PL.bk.find(b=>b.id===sel.id)||{}):sel&&sel.k==='door'?ramblaOf(doorById(sel.id)||{x:-9,y:-9,side:'W'}):ramById(gR);
  if(R&&R.pts&&R.pts.length>1){const pts=R.pts;let k=0,best=-1;const docks=doorsOfR(R).map(slotC);
    for(let i=0;i<pts.length;i++){if(docks.some(c=>Math.hypot(c[0]-pts[i][0],c[1]-pts[i][1])<400)&&inR(pts[i],{x:R.x-5,y:R.y-5,w:R.w+10,h:R.h+10})){best=i}}
    k=best<0?Math.floor(pts.length/2):best;
    const pin=pts.slice(0,k+1),pout=pts.slice(k);
    s.push('<polyline class="route in" points="'+pin.map(p=>p.join(',')).join(' ')+'"/>');
    if(pout.length>1)s.push('<polyline class="route out" points="'+pout.map(p=>p.join(',')).join(' ')+'"/>');
    if(ed)pts.forEach((p,i)=>s.push('<circle class="handle" data-k="rpt" data-id="'+R.id+'" data-i="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="10"/>'));
  }
  // parkings
  L.parks.forEach(p=>{const n=parkCount(p.id),c=centroid(p.pts);s.push('<g class="park'+(n>=p.cap?' full':'')+'"><polygon data-k="park" data-id="'+p.id+'" points="'+p.pts.map(q=>q.join(',')).join(' ')+'"/><text x="'+c[0]+'" y="'+(c[1]-4)+'" text-anchor="middle">'+n+'/'+p.cap+'</text><text x="'+c[0]+'" y="'+(c[1]+12)+'" text-anchor="middle" style="font-size:13px;font-weight:500">'+esc(p.name)+'</text></g>');
    if(ed&&sel&&sel.k==='park'&&sel.id===p.id)p.pts.forEach((q,i)=>s.push('<circle class="handle" data-k="ppt" data-id="'+p.id+'" data-i="'+i+'" cx="'+q[0]+'" cy="'+q[1]+'" r="10"/>'))});
  // puertas
  L.doors.forEach(d=>{const r=slotRect(d),st=doorState(d),c=cur(d.id);const isSel=sel&&((sel.k==='door'&&sel.id===d.id)||(sel.k==='bk'&&(PL.bk.find(b=>b.id===sel.id)||{}).door===d.id));
    s.push('<g class="slot s-'+st+(isSel?' sel':'')+'" data-k="door" data-id="'+esc(d.id)+'"><rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="2"/><title>Puerta '+esc(d.id)+(c?' · '+esc(c.mat):'')+'</title><text class="did" x="'+(r.x+r.w/2)+'" y="'+(r.y+r.h/2+3)+'" text-anchor="middle">'+esc(d.id)+'</text></g>')});
  // accesos
  L.acc.forEach(a=>{const col=a.inn&&a.out?'#6d28d9':a.inn?'#16a34a':'#dc2626';const lb=(a.inn?'Entrada':'')+(a.inn&&a.out?' / ':'')+(a.out?'Salida':'');
    s.push('<g class="acc" data-k="acc" data-id="'+a.id+'"><circle cx="'+a.x+'" cy="'+a.y+'" r="22" fill="'+col+'"/><text x="'+a.x+'" y="'+(a.y+7)+'" text-anchor="middle">'+esc(a.id)+'</text><text class="lb" x="'+(a.x+28)+'" y="'+(a.y+6)+'" text-anchor="start">Acceso '+esc(a.id)+' · '+lb+'</text></g>')});
  if(ed&&TOOL==='park'&&draft.length)s.push('<polyline points="'+draft.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#ffb703" stroke-width="3"/>');
  const svg=$('#svg');svg.innerHTML=s.join('');svg.setAttribute('viewBox',VB.x+' '+VB.y+' '+VB.w+' '+VB.h);svg.dataset.z=VB.w>1500?'lo':'hi';svg.classList.toggle('edit',ed);
}

/* ---------------- panel ---------------- */
const rowBk=b=>{const d=doorById(b.door),r=d&&ramblaOf(d);return '<button class="row'+(sel&&sel.k==='bk'&&sel.id===b.id?' sel':'')+'" data-bk="'+b.id+'"><span class="mono">'+esc(b.mat)+'</span><span class="chip '+STC[b.st]+'">'+STN[b.st]+'</span><span class="s">'+esc(b.emp)+' · Puerta '+esc(b.door)+(r?' · '+esc(r.name):'')+' · '+hhmm(b.start)+' · '+b.dur+'′ '+T(arrTag(b))+' '+T(doorTag(b))+'</span></button>'};
function panelNow(){
  const n=now(),act=PL.bk.filter(active);
  const k=st=>PL.bk.filter(b=>b.st===st).length;
  const al=[];
  L.doors.forEach(d=>{const c=cur(d.id);if(c&&n>c.tStart+c.dur*M){const pr=project(d.id),aff=bkOfDoor(d.id).filter(b=>active(b)&&b.st!=='puerta'&&pr[b.id].delay>0).length;
    al.push('<div class="al"><span class="t">Puerta '+esc(d.id)+' excede '+mm(n-c.tStart-c.dur*M)+'′ · '+esc(c.mat)+'</span><span class="mute">'+(aff?aff+' reserva(s) siguientes retrasadas':'Sin reservas detrás')+'</span><div class="acts"><button class="btn sm p" data-fin="'+c.id+'">Finalizar</button><button class="btn sm" data-ext="'+c.id+'">+15′</button><button class="btn sm" data-door="'+esc(d.id)+'">Ver puerta</button></div></div>')}});
  L.doors.forEach(d=>{if(doorState(d)==='early'){const f=bkOfDoor(d.id).filter(b=>b.st==='fin'&&b.early>0).pop();const left=mm(f.tStart+f.dur*M-n);const cs=candidates(d.id);
    al.push('<div class="al early"><span class="t">Puerta '+esc(d.id)+' libre · '+left+'′ de tiempo extra</span>'+(cs.length?'<div class="acts">'+cs.slice(0,3).map(b=>'<button class="btn sm p" data-adv="'+b.id+'" data-to="'+esc(d.id)+'">Adelantar '+esc(b.mat)+'</button>').join('')+'</div>':'<span class="mute">Nadie esperando en esta rambla</span>')+'</div>')}});
  L.parks.forEach(p=>{const c=parkCount(p.id);if(c>=p.cap)al.push('<div class="al park"><span class="t">'+esc(p.name)+' lleno '+c+'/'+p.cap+'</span><span class="mute">Las nuevas llegadas se desvían al siguiente parking libre</span></div>')});
  act.filter(b=>b.st==='prog'&&mm(n-b.start)>L.tol).forEach(b=>al.push('<div class="al park"><span class="t">'+esc(b.mat)+' sin llegar · +'+mm(n-b.start)+'′</span><div class="acts"><button class="btn sm" data-arr="'+b.id+'">Ha llegado</button><button class="btn sm" data-bk="'+b.id+'">Ficha</button></div></div>'));
  const next=act.filter(b=>b.st!=='puerta').sort((a,b)=>a.start-b.start).slice(0,8);
  return ['Ahora en el recinto','<div class="kp"><div class="k"><b class="c-prog">'+k('prog')+'</b><span>Programados</span></div><div class="k"><b class="c-park">'+k('parking')+'</b><span>En parking</span></div><div class="k"><b class="c-door">'+k('puerta')+'</b><span>En puerta</span></div><div class="k"><b class="c-fin">'+k('fin')+'</b><span>Finalizados</span></div></div>'+
   '<div class="sec">Parkings de espera</div>'+L.parks.map(p=>{const c=parkCount(p.id);return '<button class="row" data-park="'+p.id+'"><span>'+esc(p.name)+'</span><b class="mono '+(c>=p.cap?'c-warn':'')+'">'+c+'/'+p.cap+'</b><span class="s"><span class="bar'+(c>=p.cap?' over':'')+'" style="display:block"><i style="width:'+Math.min(100,c/p.cap*100)+'%;background:'+(c>=p.cap?'var(--warn)':'var(--park)')+'"></i></span></span></button>'}).join('')+
   '<div class="sec">Avisos · '+al.length+'</div>'+(al.join('')||'<p class="mute" style="margin:0">Todo en hora</p>')+
   '<div class="sec">Próximos</div>'+next.map(rowBk).join('')];
}
function panelDoor(id){
  const d=doorById(id);if(!d)return panelNow();const r=ramblaOf(d),c=cur(id),pr=project(id),n=now(),list=bkOfDoor(id);
  let h='<dl class="d"><dt>Pabellón</dt><dd>'+esc((L.halls.find(x=>x.id===d.hall)||{}).label||d.hall)+'</dd><dt>Rambla</dt><dd>'+(r?esc(r.name):'—')+'</dd>'+(r?'<dt>Entra / sale</dt><dd>Acceso '+esc(r.inAcc)+' → Acceso '+esc(r.outAcc)+'</dd><dt>Parking</dt><dd>'+esc((parkById(r.park)||{}).name||'—')+'</dd>':'')+'</dl>';
  if(c){const p=Math.min(1,(n-c.tStart)/(c.dur*M)),over=n>c.tStart+c.dur*M;
    h+='<div class="sec">Descargando</div><div class="al'+(over?'':' early')+'" style="border-left-color:'+(over?'var(--warn)':'var(--door)')+'"><span class="t mono" style="font-size:18px">'+esc(c.mat)+'</span><span>'+esc(c.emp)+' · desde '+hhmm(c.tStart)+' · '+c.dur+'′ '+T(doorTag(c))+'</span><span class="bar'+(over?' over':'')+'"><i style="width:'+p*100+'%"></i></span><div class="acts"><button class="btn sm p" data-fin="'+c.id+'">Finalizar descarga</button><button class="btn sm" data-ext="'+c.id+'">+15′</button><button class="btn sm" data-bk="'+c.id+'">Ficha</button></div></div>'}
  else{const st=doorState(d);if(st==='early'){const cs=candidates(id);h+='<div class="al early"><span class="t">Libre antes de hora</span>'+(cs.length?'<span class="mute">Adelanta un vehículo que ya espera:</span><div class="acts">'+cs.map(b=>'<button class="btn sm p" data-adv="'+b.id+'" data-to="'+esc(id)+'">'+esc(b.mat)+' · '+STN[b.st]+'</button>').join('')+'</div>':'<span class="mute">Nadie esperando en esta rambla</span>')+'</div>'}
    else h+='<p class="mute" style="margin:0">Puerta libre.</p>'}
  h+='<div class="acts"><button class="btn p" data-newat="'+esc(id)+'">+ Reservar esta puerta</button></div>';
  h+='<div class="sec">Agenda de la puerta</div>'+(list.filter(b=>b.st!=='fin'||n-b.tEnd<3*3600*M).map(b=>{const p=pr[b.id];return rowBk(b).replace('</span></button>',(p&&p.delay&&b.st!=='fin'&&b.st!=='puerta'?' <span class="tag t-late">Prevista '+hhmm(p.ps)+' (+'+p.delay+'′)</span>':'')+'</span></button>')}).join('')||'<p class="mute" style="margin:0">Sin reservas</p>');
  return ['Puerta '+esc(id),h];
}
function panelPark(id){const p=parkById(id);if(!p)return panelNow();const list=PL.bk.filter(b=>b.st==='parking'&&b.park===id).sort((a,b)=>a.tArr-b.tArr);
  return [esc(p.name)+' · '+list.length+'/'+p.cap,'<div class="bar'+(list.length>=p.cap?' over':'')+'"><i style="width:'+Math.min(100,list.length/p.cap*100)+'%;background:'+(list.length>=p.cap?'var(--warn)':'var(--park)')+'"></i></div>'+
   (list.map(b=>{const free=!cur(b.door);return '<div class="row"><span class="mono">'+esc(b.mat)+'</span><span class="mute">'+mm(now()-b.tArr)+'′ esperando</span><span class="s">'+esc(b.emp)+' · Puerta '+esc(b.door)+' a las '+hhmm(b.start)+' '+T(arrTag(b))+'</span><span class="acts" style="grid-column:1/-1"><button class="btn sm p" data-call="'+b.id+'" '+(free?'':'disabled')+'>Llamar a '+esc(b.door)+(free?'':' (ocupada)')+'</button><button class="btn sm" data-bk="'+b.id+'">Ficha</button></span></div>'}).join('')||'<p class="mute" style="margin:0">Vacío</p>')];}
function panelRam(id){const r=ramById(id);if(!r)return panelNow();const ds=doorsOfR(r);
  return [esc(r.name),'<dl class="d"><dt>Entrada</dt><dd>Acceso '+esc(r.inAcc)+'</dd><dt>Salida</dt><dd>Acceso '+esc(r.outAcc)+'</dd><dt>Parking de espera</dt><dd>'+esc((parkById(r.park)||{}).name||'—')+' · '+parkCount(r.park)+'/'+((parkById(r.park)||{}).cap||0)+'</dd><dt>Puertas</dt><dd>'+ds.length+'</dd></dl>'+
   '<div class="sec">Puertas</div>'+ds.map(d=>{const c=cur(d.id),st=doorState(d);return '<button class="row" data-door="'+esc(d.id)+'"><span class="mono">'+esc(d.id)+'</span><span class="chip '+({free:'c-prog',soon:'c-park',busy:'c-door',over:'c-warn',early:'c-early'})[st]+'">'+({free:'Libre',soon:'Llega pronto',busy:'Descargando',over:'Excedido',early:'Libre antes'})[st]+'</span><span class="s">'+(c?esc(c.mat)+' · '+esc(c.emp):'')+'</span></button>'}).join('')];}
function panelBk(id){const b=PL.bk.find(x=>x.id===id);if(!b)return panelNow();const d=doorById(b.door),r=d&&ramblaOf(d),pr=project(b.door)[b.id]||{};
  let a='';
  if(b.st==='prog')a='<button class="btn p" data-arr="'+b.id+'">Ha llegado → parking</button><button class="btn" data-call="'+b.id+'" '+(cur(b.door)?'disabled':'')+'>Directo a puerta</button>';
  if(b.st==='parking')a='<button class="btn p" data-call="'+b.id+'" '+(cur(b.door)?'disabled':'')+'>Llamar a puerta '+esc(b.door)+'</button>';
  if(b.st==='puerta')a='<button class="btn p" data-fin="'+b.id+'">Finalizar descarga</button><button class="btn" data-ext="'+b.id+'">+15′</button>';
  if(active(b))a+='<button class="btn d" data-cancel="'+b.id+'">Cancelar</button>';
  const doors=r?doorsOfR(r):L.doors;
  return ['<span class="mono">'+esc(b.mat)+'</span> <span class="chip '+STC[b.st]+'">'+STN[b.st]+'</span>',
   '<dl class="d"><dt>Empresa</dt><dd>'+esc(b.emp)+'</dd><dt>Puerta</dt><dd>'+esc(b.door)+' · '+(r?esc(r.name):'')+'</dd><dt>Slot</dt><dd>'+hhmm(b.start)+' – '+hhmm(b.start+b.dur*M)+' ('+b.dur+'′)</dd>'+(pr.delay&&active(b)&&b.st!=='puerta'?'<dt>Previsión</dt><dd class="c-warn">'+hhmm(pr.ps)+' (+'+pr.delay+'′ por la puerta)</dd>':'')+
   (r?'<dt>Recorrido</dt><dd>Acceso '+esc(r.inAcc)+' → '+esc((parkById(b.park||r.park)||{}).name||'')+' → '+esc(b.door)+' → Acceso '+esc(r.outAcc)+'</dd>':'')+
   '<dt>Llegada</dt><dd>'+hhmm(b.tArr)+' '+T(arrTag(b))+'</dd><dt>En puerta</dt><dd>'+hhmm(b.tStart)+(b.tEnd?' – '+hhmm(b.tEnd):'')+' '+T(doorTag(b))+'</dd></dl>'+
   '<div class="acts">'+a+'</div>'+
   (active(b)?'<div class="sec">Cambiar</div><div class="grid2"><label class="f">Puerta<select class="in" id="cdoor">'+doors.map(x=>'<option'+(x.id===b.door?' selected':'')+'>'+esc(x.id)+'</option>').join('')+'</select></label><label class="f">Hora<input class="in" type="time" id="ctime" value="'+hhmm(b.start)+'"></label></div><div class="durs">'+L.durs.map(v=>'<button data-cdur="'+v+'" aria-pressed="'+(b.dur===v)+'">'+v+'′</button>').join('')+'</div><div class="acts"><button class="btn" data-save="'+b.id+'">Guardar cambios</button></div>':'')];}
let NF={mat:'',emp:'',door:'',dur:30,time:''};
function panelNew(){const ds=L.doors.map(d=>d.id).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!NF.door)NF.door='3.10';
  const nf=nextFree(NF.door,now(),NF.dur);if(!NF.time)NF.time=hhmm(Math.ceil(nf/(5*M))*5*M);
  const d=doorById(NF.door),r=d&&ramblaOf(d);

  for(let t=Math.ceil(t0/(30*M))*30*M;t<t1;t+=30*M){const x=X(t);s+='<line x1="'+x+'" y1="16" x2="'+x+'" y2="'+H+'" stroke="#e3e9ef"/><text x="'+x+'" y="11" font-size="10" text-anchor="middle" fill="#4a5e72" font-family="var(--fm)">'+hhmm(t)+'</text>'}

      s+='<rect x="'+X(ps)+'" y="'+(y+2)+'" width="'+Math.max(2,X(pe)-X(ps))+'" height="'+(RH-6)+'" fill="none" stroke="#9aa9b8" stroke-dasharray="3 2" rx="2"/>';

      const a=Math.max(p.ps,t0),e=b.st==='fin'?b.tEnd:p.pe;
      s+='<g data-gbk="'+b.id+'" style="cursor:pointer"><rect x="'+X(a)+'" y="'+(y+4)+'" width="'+Math.max(3,X(e)-X(a))+'" height="'+(RH-10)+'" fill="'+col+'" rx="2" opacity="'+(b.st==='prog'?.75:1)+'"/><text x="'+(X(a)+4)+'" y="'+(y+15)+'" font-size="10" fill="#fff" font-family="var(--fm)" font-weight="600">'+esc(b.mat)+(p.delay&&active(b)&&b.st!=='puerta'?' +'+p.delay+'′':'')+'</text></g>'})});
  const xn=X(n);s+='<line x1="'+xn+'" y1="14" x2="'+xn+'" y2="'+H+'" stroke="#b42318" stroke-width="2"/></svg>';
  $('#gb').innerHTML=s;
  $('#gsvg').addEventListener('click',e=>{const g=e.target.closest('[data-gbk]');if(g){sel={k:'bk',id:g.dataset.gbk};MODE='op';renderAll();return}
    const lab=e.target.closest('[data-door]');if(lab){sel={k:'door',id:lab.dataset.door};renderAll();return}
    const row=e.target.closest('[data-gd]');if(row){const svg=$('#gsvg'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
      let t=t0+(q.x-LW)/(W-LW)*(t1-t0);t=Math.round(t/(5*M))*5*M;NF={mat:'',emp:'',door:row.dataset.gd,dur:L.durs[0],time:hhmm(Math.max(t,now()))};sel={k:'new'};renderAll()}});

    const st=d.getTime(),pr=project(NF.door);const clash=bkOfDoor(NF.door).filter(active).find(b=>{const p=pr[b.id];return st<p.pe&&st+NF.dur*M>p.ps});

    if(TOOL==='door'&&!t){const id=prompt('Número de puerta (ej. 3.10):');if(!id)return;if(doorById(id)){toast('Ya existe');return}

  }else if(t){const k=t.dataset.k,id=t.dataset.id;sel={k:k==='acc'?'ram':k,id:k==='acc'?(L.ramblas.find(r=>r.inAcc===id)||{}).id:id};if(k==='ram')gR=id;if(k==='door'){const r=ramblaOf(doorById(id));if(r)gR=r.id}if(!sel.id)sel=null;renderAll();return}

  const p=svgPt(e),dx=p[0]-drag.p0[0],dy=p[1]-drag.p0[1];if(!dx&&!dy)return;drag.p0=p;drag.moved=true;

});
const endDrag=()=>{if(drag&&drag.k!=='pan'){saveL();if(drag.moved)renderSide()}drag=null};
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
function dist(p,h){const cx=Math.max(h.x,Math.min(p[0],h.x+h.w)),cy=Math.max(h.y,Math.min(p[1],h.y+h.h));return Math.hypot(p[0]-cx,p[1]-cy)}
function sideOf(p,h){const d={W:Math.abs(p[0]-h.x),E:Math.abs(p[0]-h.x-h.w),N:Math.abs(p[1]-h.y),S:Math.abs(p[1]-h.y-h.h)};return Object.keys(d).sort((a,b)=>d[a]-d[b])[0]}
function zoom(f,cx,cy){const nw=Math.min(VW,Math.max(300,VB.w*f)),k=nw/VB.w;cx=cx==null?VB.x+VB.w/2:cx;cy=cy==null?VB.y+VB.h/2:cy;VB={x:cx-(cx-VB.x)*k,y:cy-(cy-VB.y)*k,w:nw,h:VB.h*k};renderMap()}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(e);zoom(e.deltaY>0?1.15:1/1.15,p[0],p[1])},{passive:false});
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{if(b.dataset.z==='fit'){VB={x:0,y:0,w:VW,h:VH};renderMap()}else zoom(b.dataset.z==='in'?1/1.4:1.4)});
function hint(t){const h=$('#hint');if(t){h.textContent=t;h.hidden=false}else h.hidden=true}

/* ---------------- cabecera ---------------- */
document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{const v=+b.dataset.sim;OFF=v?OFF+v*M:0;renderAll()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{MODE=b.dataset.mode;TOOL='move';draft=[];hint(MODE==='cfg'?'Modo configuración: arrastra puertas, accesos y parkings a su sitio real. Los cambios se guardan solos.':'');if(MODE==='op')sel=null;renderAll()});
$('#newb').onclick=()=>{MODE='op';NF={mat:'',emp:'',door:sel&&sel.k==='door'?sel.id:(NF.door||'3.10'),dur:L.durs[0],time:''};sel={k:'new'};renderAll()};
/* Importa la agenda de hoy de BeUnifyT (solo lectura de 'cu1_local'; no modifica nada de la app principal) */
$('#imp').onclick=()=>{let db;try{db=JSON.parse(localStorage.getItem(SRC))}catch(e){}
  if(!db){toast('No hay datos de BeUnifyT en este navegador. Abre primero la app principal.');return}
  const today=new Date(now()).toISOString().slice(0,10),ag=(db.agenda||[]).filter(a=>a.fecha===today&&a.matricula);
  let n=0,sk=0;ag.forEach(a=>{if(PL.bk.some(b=>b.src==='agenda:'+a.id)){sk++;return}
    let door=a.puertaHall&&doorById(String(a.puertaHall).replace(',','.'))?String(a.puertaHall).replace(',','.'):null;
    const h=String(a.hall||'').split(/[,\s]/)[0];if(!door){const ds=L.doors.filter(d=>d.hall===h);door=ds.length?ds[0].id:'3.10'}
    const tm=String(a.hora||'08:00').split(':');const d=new Date(now());d.setHours(+tm[0]||8,+tm[1]||0,0,0);
    PL.bk.push({id:uid(),mat:normP(a.matricula),emp:a.empresa||a.expositor||'',door,start:d.getTime(),dur:L.durs[0],st:'prog',tArr:null,tStart:null,tEnd:null,park:null,src:'agenda:'+a.id});n++});
  log('Importadas '+n+' citas de agenda');commit();toast(n?'Importadas '+n+' citas de hoy'+(sk?' ('+sk+' ya estaban)':''):'Sin citas nuevas para hoy en la agenda'+(sk?' ('+sk+' ya importadas)':''))};

/* ---------------- render ---------------- */
function renderMap(){rMap()}
function renderAll(){$('#clock').textContent=hhmm(now());$('#sim').textContent=OFF?'SIMULACIÓN +'+mm(OFF)+'′':'';
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===MODE)));
  rMap();renderSide();rGantt()}
function commit(){saveP();renderAll()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(TOOL!=='move'){TOOL='move';draft=[];hint()}else sel=null;renderAll()}});
renderAll();
setInterval(()=>{const a=document.activeElement;if(drag||a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;renderAll()},20000);
</script>
</body>
</html>
