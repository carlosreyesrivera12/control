<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIBA · Logística de empresa</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#0f172a;--ink2:#334155;--mute:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--brand:#00a88c;--brand2:#00806b;--brandl:#e6f7f4;--red:#dc2626;--redl:#fef2f2;--amber:#d97706;--amberl:#fffbeb;--blue:#2563eb;--bluel:#eff6ff;--green:#16a34a;--greenl:#f0fdf4;--purple:#7c3aed;--purplel:#f5f3ff;--r:10px;--sh:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);--font:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 14.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.3px}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;font-style:normal;font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:0 12px;height:36px;border-radius:8px;color:var(--ink2);font-weight:600;white-space:nowrap}
.tab:hover{background:var(--bg)}
.tab.on{background:var(--brandl);color:var(--brand2)}
.tab em{font-style:normal;font-size:11.5px;background:var(--line);border-radius:10px;padding:1px 7px;margin-left:5px;color:var(--ink2)}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}
.sync.ok b{background:var(--green)}.sync.err b{background:var(--red)}
.main{padding:16px;max-width:1500px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:var(--brand2)}
.btn.d{color:var(--red);border-color:#fecaca}.btn.d:hover{background:var(--redl)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.g{border-color:transparent;background:transparent}.btn.g:hover{background:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.h1{font-size:20px;font-weight:800;margin:0}
.h2{font-size:15px;font-weight:700;margin:0 0 10px}
.muted{color:var(--mute)}.small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
input.in,select.in,textarea.in{width:100%;height:38px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff;outline:none}
textarea.in{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,168,140,.15)}
.search{max-width:320px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.t th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--mute);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#f8fafc}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);max-height:calc(100vh - 210px)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--line);color:var(--ink2)}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;white-space:nowrap}
.c-red{background:var(--redl);color:var(--red)}.c-amb{background:var(--amberl);color:var(--amber)}.c-grn{background:var(--greenl);color:var(--green)}.c-blu{background:var(--bluel);color:var(--blue)}.c-pur{background:var(--purplel);color:var(--purple)}.c-gry{background:#f1f5f9;color:var(--mute)}
.pipe{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1;min-width:112px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);cursor:pointer;text-align:left}
.pipe .st:hover{border-color:var(--line2)}
.pipe .st b{display:block;font-size:22px;line-height:1.1}
.pipe .st span{font-size:12px;font-weight:700;color:var(--mute)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 50px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hbar .tr{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.hbar .tr i{display:block;height:100%;background:var(--brand);border-radius:5px}
.hbar .n{text-align:right;font-weight:700}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50;display:none}
.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:60;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(15,23,42,.15)}
.dr.on{display:flex}
.dr .hd{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.dr .hd .tt{font-weight:800;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr .bd{flex:1;overflow:auto;padding:16px}
.dr .ft{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-top:1px solid var(--line);flex-wrap:wrap}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.sec>h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--brand2)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 12px}
.f label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.f.full{grid-column:1/-1}
.f .ck{display:flex;align-items:center;gap:8px;height:38px;font-weight:600}
.f .ck input{width:18px;height:18px;accent-color:var(--brand)}
.req:after{content:" *";color:var(--red)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px}
.kv div{font-size:13.5px;min-width:0;overflow-wrap:anywhere}.kv small{display:block;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 12px 20px;font-size:13.5px}
.tl li:before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.tl li:after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--line2)}
.tl li:last-child:after{display:none}
.steps{display:flex;gap:4px;margin:4px 0 12px;flex-wrap:wrap}
.steps span{flex:1;min-width:70px;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--brand)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;display:none;max-width:90vw}
.toast.e{background:var(--red)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:6px;font-size:13.5px}
.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.donut div{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:20px}
.legend{font-size:13px}.legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mini{font-size:12.5px;color:var(--mute)}
.list-mini{max-height:320px;overflow:auto}
.lm{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lm:last-child{border-bottom:0}
@media(max-width:700px){.tabs{order:9;flex-basis:100%}.main{padding:10px}.hide-m{display:none}.dr .bd{padding:10px}.g2{grid-template-columns:1fr}}
@media print{.top,.no-print{display:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><i>MI</i>MIBA</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="sync" id="sync"><b></b><span>Conectando…</span></div>
  <button class="btn p" onclick="M.newServicio()">+ Servicio</button>
</div>
<main class="main" id="main"></main>
<div class="ov" id="ov" onclick="M.closeDr()"></div>
<aside class="dr" id="dr"><div class="hd"><div class="tt" id="drT"></div><button class="btn g" onclick="M.closeDr()">✕</button></div><div class="bd" id="drB"></div><div class="ft" id="drF"></div></aside>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
/* ═══ MIBA · módulo de logística de empresa (BeUnifyT) ═══
   Datos en Firebase RTDB: cu1/miba/<colección>/<id>  (no toca cu1/controlunificado)
   Sin Firebase (archivo abierto suelto) → localStorage 'bu_miba_local'. */
var COLL=['empresa','choferes','vehiculos','logisticas','supervisores','eventos','servicios'];
var S={};COLL.forEach(function(c){S[c]={};});
var REF=null,MODE='local',VIEW='dash',F={q:'',est:'',ev:'',per:'semana',arch:false},LS='bu_miba_local',CUR=null,RTE=null;
var M=window.M={};

/* ── Utilidades ── */
function $(id){return document.getElementById(id);}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(m,err){var t=$('toast');t.textContent=m;t.className='toast'+(err?' e':'');t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none';},err?5000:2400);}
function pad(n){return (n<10?'0':'')+n;}
function toLocalInput(ts){if(!ts)return '';var d=new Date(ts);if(isNaN(d))return '';return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function fromLocalInput(v){if(!v)return null;var t=new Date(v).getTime();return isNaN(t)?null:t;}
function fdt(ts){if(!ts)return '—';var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fdate(v){if(!v)return '—';var d=new Date(v);if(isNaN(d))return E(v);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function fnum(n,dec){if(n==null||n===''||isNaN(n))return '—';return Number(n).toLocaleString('es-ES',{maximumFractionDigits:dec==null?0:dec});}
function fmin(m){if(m==null||isNaN(m))return '—';var s=m<0?'-':'';m=Math.abs(Math.round(m));var h=Math.floor(m/60),mm=m%60;return s+(h?h+' h ':'')+(mm||!h?mm+' min':'');}
function digits(s){return String(s||'').replace(/[^\d+]/g,'').replace(/^\+/,'');}
function user(){try{var u=parent.buMibaUser&&parent.buMibaUser();return u?(u.nombre||u.email||u.id||''):'';}catch(e){return '';}}
function list(c,all){var o=S[c]||{};return Object.keys(o).map(function(k){return o[k];}).filter(function(x){return x&&(all||!x._arch);});}
function get(c,id){return id&&S[c]?S[c][id]:null;}
function clean(o){return JSON.parse(JSON.stringify(o));}
function daysTo(d){if(!d)return null;var t=new Date(d).getTime();if(isNaN(t))return null;return Math.floor((t-Date.now())/864e5);}

/* ── Persistencia ── */
function setSync(st,msg){var s=$('sync');s.className='sync'+(st==='ok'?' ok':st==='err'?' err':'');s.querySelector('span').textContent=msg;}
function loadLocal(){try{var v=JSON.parse(localStorage.getItem(LS)||'{}');COLL.forEach(function(c){S[c]=v[c]||{};});}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function init(){
  var db=null;try{db=parent.buMibaFb&&parent.buMibaFb();}catch(e){}
  if(db&&db.ref){
    REF=db.ref('cu1/miba');
    REF.on('value',function(sn){var v=sn.val()||{};COLL.forEach(function(c){S[c]=v[c]||{};});MODE='fb';setSync('ok','Sincronizado');render();},
      function(err){MODE='local';loadLocal();setSync('err','Sin permiso en la nube · guardado local');toast('Sin acceso a cu1/miba ('+(err&&err.code||'error')+'). Se guarda en este dispositivo.',1);render();});
  }else{loadLocal();setSync('err','Modo local (sin sesión)');render();}
}
function save(c,o,silent){
  var now=Date.now();if(!o.id)o.id=uid();if(!o.createdAt){o.createdAt=now;o.createdBy=user();}o.updatedAt=now;o.updatedBy=user();
  S[c][o.id]=o;
  if(REF&&MODE==='fb'){REF.child(c+'/'+o.id).set(clean(o)).catch(function(e){toast('Error al guardar: '+(e&&e.code||e),1);});}else saveLocal();
  if(!silent)render();return o;
}

/* ── Catálogos ── */
var TIPOS=['Furgoneta (< 3,5 t)','Rígido 7,5 t','Rígido 12 t','Rígido 18 t','Tráiler / semirremolque','Megatráiler','Frigorífico','Lona / tautliner','Plataforma','Góndola / especial','Portacontenedores','Camión grúa'];
var PAISES=['España','Francia','Alemania','Italia','Portugal','Países Bajos','Bélgica','Reino Unido','Suiza','Austria','Polonia','Chequia','Dinamarca','Suecia','Noruega','Irlanda','Hungría','Rumanía','Grecia','Turquía','Marruecos','EE. UU.','México','Argentina','Brasil','Chile','Emiratos Árabes Unidos','China'];
var EST=[
 {k:'PLANIFICADO',l:'Planificado',c:'#64748b'},
 {k:'CONFIRMADO',l:'Confirmado',c:'#2563eb'},
 {k:'CARGANDO',l:'Cargando',c:'#4f46e5'},
 {k:'EN_RUTA',l:'En ruta',c:'#d97706'},
 {k:'ESPERA',l:'Preregistro / parking',c:'#7c3aed'},
 {k:'LLEGADO',l:'Llegado',c:'#0d9488'},
 {k:'DESCARGA',l:'Descargando',c:'#0891b2'},
 {k:'COMPLETADO',l:'Completado',c:'#16a34a'},
 {k:'ANULADO',l:'Anulado',c:'#dc2626'}];
var ESTI={};EST.forEach(function(e,i){e.i=i;ESTI[e.k]=e;});
var INC_T=['Retraso','Adelanto','Avería','Accidente','Tráfico / corte','Documentación','Aduana','Acreditación / acceso','Carga dañada','Chofer','Otro'];
function badge(k){var e=ESTI[k]||ESTI.PLANIFICADO;return '<span class="badge" style="color:'+e.c+';background:'+e.c+'14">'+E(e.l)+'</span>';}

/* ── Esquemas de formularios ── */
var REFLBL={
 choferes:function(x){return (x.nombre||'')+' '+(x.apellidos||'');},
 vehiculos:function(x){return (x.matricula||'')+(x.tipo?' · '+x.tipo:'');},
 logisticas:function(x){return (x.nombre||'')+(x.ciudad?' · '+x.ciudad:'');},
 supervisores:function(x){return (x.nombre||'')+(x.rol?' · '+x.rol:'');},
 eventos:function(x){return (x.nombre||'')+(x.ciudad?' · '+x.ciudad:'');}
};
function lbl(c,id){var x=get(c,id);return x?REFLBL[c](x).trim():'';}
var SCH={
 empresa:{t:'Mi empresa',sec:[
  {h:'Datos de la empresa',f:[{k:'razon',l:'Razón social',r:1},{k:'comercial',l:'Nombre comercial'},{k:'cif',l:'CIF / VAT'},{k:'pais',l:'País',t:'pais'},{k:'ciudad',l:'Ciudad'},{k:'direccion',l:'Dirección',w:1},{k:'telefono',l:'Teléfono',t:'tel'},{k:'email',l:'Email',t:'email'},{k:'web',l:'Web'}]},
  {h:'Responsable de logística',f:[{k:'resp',l:'Nombre'},{k:'respTel',l:'Teléfono',t:'tel'},{k:'respEmail',l:'Email',t:'email'},{k:'horario',l:'Horario de atención'}]},
  {h:'Notas',f:[{k:'notas',l:'Notas internas',t:'ta',w:1}]}]},
 choferes:{t:'Chofer',sec:[
  {h:'Datos',f:[{k:'nombre',l:'Nombre',r:1},{k:'apellidos',l:'Apellidos'},{k:'doc',l:'DNI / pasaporte'},{k:'nacionalidad',l:'Nacionalidad'},{k:'telefono',l:'Teléfono',t:'tel',r:1},{k:'whatsapp',l:'WhatsApp',t:'tel'},{k:'email',l:'Email',t:'email'},{k:'idiomas',l:'Idiomas'},{k:'logistica',l:'Empresa logística',t:'ref',c:'logisticas'}]},
  {h:'Habilitaciones',f:[{k:'carnet',l:'Carnet',t:'sel',o:['B','C1','C','C+E','D']},{k:'carnetCad',l:'Caducidad carnet',t:'date'},{k:'capCad',l:'Caducidad CAP',t:'date'},{k:'tacoCad',l:'Caducidad tarjeta tacógrafo',t:'date'},{k:'adr',l:'ADR (mercancías peligrosas)',t:'chk'},{k:'activo',l:'Activo',t:'chk',d:true}]},
  {h:'Notas',f:[{k:'notas',l:'Notas',t:'ta',w:1}]}]},
 vehiculos:{t:'Vehículo',sec:[
  {h:'Vehículo',f:[{k:'matricula',l:'Matrícula',r:1},{k:'remolque',l:'Matrícula remolque'},{k:'tipo',l:'Tipo de camión',t:'sel',o:TIPOS,r:1},{k:'modelo',l:'Marca / modelo'},{k:'logistica',l:'Empresa logística',t:'ref',c:'logisticas'},{k:'chofer',l:'Chofer habitual',t:'ref',c:'choferes'}]},
  {h:'Capacidad',f:[{k:'mma',l:'MMA (kg)',t:'num'},{k:'util',l:'Carga útil (kg)',t:'num'},{k:'largo',l:'Largo caja (m)',t:'num'},{k:'alto',l:'Alto total (m)',t:'num'},{k:'vol',l:'Volumen (m³)',t:'num'},{k:'palets',l:'Palets',t:'num'},{k:'trampilla',l:'Plataforma elevadora',t:'chk'},{k:'adr',l:'Apto ADR',t:'chk'},{k:'frio',l:'Frío / temperatura',t:'chk'}]},
  {h:'Documentación',f:[{k:'itvCad',l:'Caducidad ITV',t:'date'},{k:'seguroCad',l:'Caducidad seguro',t:'date'},{k:'tarjetaTte',l:'Tarjeta de transporte'},{k:'activo',l:'Activo',t:'chk',d:true},{k:'notas',l:'Notas',t:'ta',w:1}]}]},
 logisticas:{t:'Empresa logística',sec:[
  {h:'Empresa',f:[{k:'nombre',l:'Nombre',r:1},{k:'cif',l:'CIF / VAT'},{k:'pais',l:'País',t:'pais',r:1},{k:'ciudad',l:'Ciudad',r:1},{k:'direccion',l:'Dirección',w:1},{k:'telefono',l:'Teléfono',t:'tel'},{k:'email',l:'Email',t:'email'},{k:'whatsapp',l:'WhatsApp',t:'tel'},{k:'web',l:'Web'}]},
  {h:'Operativa',f:[{k:'contacto',l:'Persona de contacto'},{k:'contactoTel',l:'Teléfono contacto',t:'tel'},{k:'flota',l:'Tipos de camión que ofrece',t:'ta',w:1},{k:'zonas',l:'Zonas / países que cubre',w:1},{k:'reemplazo',l:'Disponible como reemplazo',t:'chk'},{k:'aduanas',l:'Gestiona aduanas',t:'chk'},{k:'valor',l:'Valoración',t:'sel',o:['','★','★★','★★★','★★★★','★★★★★']},{k:'tarifa',l:'Tarifa orientativa (€/km)',t:'num'}]},

function isHeavy(o){var t=o.tipoCamion||'';if(!t){var v=get('vehiculos',o.vehiculo);t=v?v.tipo||'':'';}return !/Furgoneta/i.test(t);}
function nextRef(){var d=new Date(),p='MB-'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-',n=list('servicios',true).filter(function(s){return String(s.ref||'').indexOf(p)===0;}).length+1;return p+(n<10?'00':n<100?'0':'')+n;}

function speedFor(t){return /Furgoneta/i.test(t||'')?82:/7,5/.test(t||'')?75:68;}
function truckFactor(t){return /Furgoneta/i.test(t||'')?1.05:/7,5|12 t/.test(t||'')?1.15:1.25;}

/* ── Estimación de llegada: conducción + descansos UE 561/2006 + día/hora de salida ── */
function inBan(d){var w=d.getDay(),h=d.getHours();return (w===6&&h>=22)||(w===0&&h<22);}
function traffic(d){var w=d.getDay(),h=d.getHours();if(w>=1&&w<=5&&((h>=7&&h<9)||(h>=17&&h<19)))return .82;if(w===5&&h>=14&&h<20)return .85;if(h>=22||h<5)return 1.05;return 1;}
function estimateETA(salida,horas,o){
  o=o||{};var t=new Date(salida).getTime(),rem=Number(horas)*60,since=0,day=0,maxDay=o.doble?18*60:9*60,rest=o.doble?9*60:11*60,br=0,rs=0,ban=0,run=0,g=0,drive=0,step=15;
  if(!t||!(rem>0))return {eta:null};
  while(rem>0&&g++<40000){
    var d=new Date(t);
    if(o.prohib&&o.heavy&&inBan(d)){t+=step*6e4;ban+=step;run+=step;if(run>=45)since=0;if(run>=rest)day=0;continue;}run=0;
    if(!o.doble&&since>=270){t+=45*6e4;since=0;br++;continue;}
    if(day>=maxDay){t+=rest*6e4;day=0;since=0;rs++;continue;}
    var s=Math.min(step,rem/traffic(d));rem-=s*traffic(d);t+=s*6e4;since+=s;day+=s;drive+=s;
  }
  return {eta:t,total:(t-new Date(salida).getTime())/6e4,breaks:br,rests:rs,ban:ban,drive:drive};
}
M.estimateETA=estimateETA;
M.calcEta=function(quiet){
  var sal=fromLocalInput(fv('salidaPrev')),h=Number(fv('horasCond'));
  if(!sal||!h){if(!quiet)toast('Indica salida prevista y horas de conducción (o calcula la ruta)',1);return;}
  var r=estimateETA(sal,h,{doble:!!fv('chofer2'),heavy:isHeavy({tipoCamion:fv('tipoCamion'),vehiculo:fv('vehiculo')}),prohib:fv('prohib')});
  setf('eta',r.eta,true);
  var dn=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][new Date(sal).getDay()];
  $('rutaInfo').textContent='Salida en '+dn+' · total '+fmin(r.total)+' · '+r.breaks+' pausas de 45 min · '+r.rests+' descansos diarios'+(r.ban?' · '+fmin(r.ban)+' parado por prohibición de fin de semana':'')+' · estimación aproximada';
};
function geocode(q){return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept-Language':'es'}}).then(function(r){return r.json();}).then(function(a){if(!a||!a[0])throw new Error('No se encontró: '+q);return {lat:+a[0].lat,lon:+a[0].lon,name:a[0].display_name};});}
M.calcRuta=function(){
  var o=[fv('oDir'),fv('oCiudad'),fv('oPais')].filter(Boolean).join(', '),d=[fv('dDir'),fv('dCiudad'),fv('dPais')].filter(Boolean).join(', ');
  if(!fv('oCiudad')&&!fv('oDir')||!fv('dCiudad')&&!fv('dDir')){toast('Rellena origen y destino (al menos ciudad)',1);return;}
  var info=$('rutaInfo');info.textContent='Calculando ruta…';
  var A;geocode(o).catch(function(){return geocode([fv('oCiudad'),fv('oPais')].filter(Boolean).join(', '));}).then(function(a){A=a;return geocode(d).catch(function(){return geocode([fv('dCiudad'),fv('dPais')].filter(Boolean).join(', '));});})
  .then(function(B){return fetch('https://router.project-osrm.org/route/v1/driving/'+A.lon+','+A.lat+';'+B.lon+','+B.lat+'?overview=false').then(function(r){return r.json();});})
  .then(function(j){
    if(!j.routes||!j.routes[0])throw new Error('Sin ruta por carretera');
    var km=Math.round(j.routes[0].distance/1000),h=j.routes[0].duration/3600*truckFactor(fv('tipoCamion'));
    setf('km',km,true);setf('horasCond',Math.round(h*10)/10,true);
    info.textContent=km+' km · '+fmin(h*60)+' de conducción en camión';
    if(fv('salidaPrev'))M.calcEta(true);
  }).catch(function(e){info.textContent='';toast('No se pudo calcular: '+(e.message||e)+'. Puedes poner los km a mano.',1);});
};

function dist(a,b,c,d){var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}
M.buscarParkings=function(){
  var q=[fv('direccion'),fv('cp'),fv('ciudad'),fv('pais')].filter(Boolean).join(', ')||[fv('centro'),fv('ciudad')].filter(Boolean).join(', ');
  if(!q){toast('Rellena la dirección o el centro y la ciudad',1);return;}
  var info=$('pkInfo');info.textContent='Buscando…';
  geocode(q).catch(function(){return geocode([fv('centro'),fv('ciudad'),fv('pais')].filter(Boolean).join(', '));}).then(function(p){
    var qs='[out:json][timeout:25];(nwr(around:15000,'+p.lat+','+p.lon+')["amenity"="parking"]["hgv"~"yes|designated"];nwr(around:15000,'+p.lat+','+p.lon+')["amenity"="truck_stop"];nwr(around:20000,'+p.lat+','+p.lon+')["highway"="services"];nwr(around:2500,'+p.lat+','+p.lon+')["amenity"="parking"]["access"!="private"];);out center 60;';

function target(s){return s.slot||s.eta||null;}
function delay(s){
  var tg=target(s);if(!tg)return null;
  if(s.llegadaReal)return {m:(s.llegadaReal-tg)/6e4,live:false};
  if(s.estado!=='ANULADO'&&s.estado!=='COMPLETADO'&&(ESTI[s.estado]||{}).i<ESTI.LLEGADO.i&&Date.now()>tg+15*6e4)return {m:(Date.now()-tg)/6e4,live:true};
  return null;
}
function delayChip(s){var d=delay(s);if(!d)return '';if(Math.abs(d.m)<=15)return '<span class="chip c-grn">Puntual</span>';if(d.m>0)return '<span class="chip c-red">'+(d.live?'Retraso en curso ':'Retraso ')+fmin(d.m)+'</span>';return '<span class="chip c-blu">Adelanto '+fmin(-d.m)+'</span>';}
function openInc(s){return (s.incid||[]).filter(function(i){return !i.ok;}).length;}
function srvDate(s){return s.slot||s.eta||s.salidaPrev||s.createdAt;}
function inPeriod(s){
  if(F.per==='todo')return true;var t=srvDate(s);if(!t)return true;var d0=new Date();d0.setHours(0,0,0,0);var a=d0.getTime(),b;
  if(F.per==='hoy')b=a+864e5;else if(F.per==='manana'){a+=864e5;b=a+864e5;}else{a-=864e5;b=a+8*864e5;}
  return t>=a&&t<b;
}
function srvFiltered(useStatus){
  var q=F.q.toLowerCase();
  return list('servicios',F.arch).filter(function(s){
    if(F.ev&&s.evento!==F.ev)return false;if(useStatus&&F.est&&s.estado!==F.est)return false;
    if(VIEW==='dash'&&!inPeriod(s))return false;
    if(q){var txt=[s.ref,s.oNombre,s.oCiudad,s.dCentro,s.dCiudad,s.hall,s.stand,s.refDestino,lbl('choferes',s.chofer),lbl('vehiculos',s.vehiculo),lbl('logisticas',s.logistica),lbl('eventos',s.evento)].join(' ').toLowerCase();if(txt.indexOf(q)<0)return false;}
    return true;
  }).sort(function(a,b){return (srvDate(a)||0)-(srvDate(b)||0);});
}

function replHTML(s){

  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='MIBA_servicios_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();
};

var COLS={
 choferes:[['Nombre',function(x){return '<b>'+E(REFLBL.choferes(x))+'</b>'+(x.activo===false?' <span class="chip c-gry">Inactivo</span>':'');}],['Teléfono',function(x){return contact('',x.telefono,x.email,x.whatsapp);}],['Logística',function(x){return E(lbl('logisticas',x.logistica)||'—');}],['Carnet',function(x){return E(x.carnet||'')+(x.adr?' <span class="chip c-pur">ADR</span>':'');}],['Caducidades',function(x){return cad([['Carnet',x.carnetCad],['CAP',x.capCad],['Tacógrafo',x.tacoCad]]);}],['Servicios',function(x){return list('servicios').filter(function(s){return s.chofer===x.id||s.chofer2===x.id;}).length;}]],
 vehiculos:[['Matrícula',function(x){return '<b>'+E(x.matricula)+'</b>'+(x.remolque?' <span class="mini">+ '+E(x.remolque)+'</span>':'')+(x.activo===false?' <span class="chip c-gry">Inactivo</span>':'');}],['Tipo',function(x){return E(x.tipo||'');}],['Capacidad',function(x){return [x.util&&fnum(x.util)+' kg',x.vol&&fnum(x.vol)+' m³',x.palets&&x.palets+' palets'].filter(Boolean).join(' · ')||'—';}],['Extras',function(x){return (x.trampilla?'<span class="chip c-blu">Plataforma</span> ':'')+(x.adr?'<span class="chip c-pur">ADR</span> ':'')+(x.frio?'<span class="chip c-blu">Frío</span>':'');}],['Logística',function(x){return E(lbl('logisticas',x.logistica)||'—');}],['Caducidades',function(x){return cad([['ITV',x.itvCad],['Seguro',x.seguroCad]]);}]],
 logisticas:[['Empresa',function(x){return '<b>'+E(x.nombre)+'</b>'+(x.reemplazo?' <span class="chip c-grn">Reemplazo</span>':'')+(x.aduanas?' <span class="chip c-pur">Aduanas</span>':'');}],['Ciudad · País',function(x){return E([x.ciudad,x.pais].filter(Boolean).join(' · '));}],['Contacto',function(x){return contact(x.contacto,x.telefono||x.contactoTel,x.email,x.whatsapp);}],['Valoración',function(x){return E(x.valor||'');}],['Choferes',function(x){return list('choferes').filter(function(c){return c.logistica===x.id;}).length;}],['Servicios',function(x){return list('servicios').filter(function(s){return s.logistica===x.id;}).length;}]],
 supervisores:[['Nombre',function(x){return '<b>'+E(x.nombre)+'</b>';}],['Rol',function(x){return E(x.rol||'');}],['Empresa',function(x){return E(x.empresa||'');}],['Contacto',function(x){return contact('',x.telefono,x.email,x.whatsapp);}],['Idiomas',function(x){return E(x.idiomas||'');}]],
 eventos:[['Evento',function(x){return '<b>'+E(x.nombre)+'</b>';}],['Ciudad · País',function(x){return E([x.ciudad,x.pais].filter(Boolean).join(' · '));}],['Centro',function(x){return E(x.centro||'')+'<div class="mini">'+E(x.direccion||'')+'</div>';}],['Fechas',function(x){return x.eIni?fdate(x.eIni)+' → '+fdate(x.eFin):'—';}],['Preregistro',function(x){return x.preObl?'<span class="chip c-pur">Obligatorio</span>':'';}],['Servicios',function(x){return list('servicios').filter(function(s){return s.evento===x.id;}).length;}]]
};
function cad(arr){return arr.map(function(p){var d=daysTo(p[1]);if(d==null)return '';return '<span class="chip '+(d<0?'c-red':d<30?'c-amb':'c-gry')+'">'+p[0]+' '+fdate(p[1])+'</span>';}).join(' ')||'—';}
function vColl(c){
  var q=F.q.toLowerCase(),arr=list(c,F.arch).filter(function(x){return !q||JSON.stringify(x).toLowerCase().indexOf(q)>=0;}).sort(function(a,b){return REFLBL[c](a).localeCompare(REFLBL[c](b));});
  var h='<div class="row" style="margin-bottom:12px"><h1 class="h1">'+E(TABS.filter(function(t){return t[0]===c;})[0][1])+'</h1><span class="sp"></span><input class="in search" id="q" type="search" placeholder="Buscar…" value="'+E(F.q)+'" oninput="M.set(\'q\',this.value)"><label class="row small" style="gap:6px"><input type="checkbox"'+(F.arch?' checked':'')+' onchange="M.set(\'arch\',this.checked)"> Mostrar archivados</label>'+(c!=='eventos'?'<button class="btn" onclick="M.importar(\''+c+'\')">⬆ Importar</button>':'')+'<button class="btn p" onclick="M.edit(\''+c+'\')">+ '+E(SCH[c].t)+'</button></div>';
  if(!arr.length)return h+'<div class="card empty">Sin registros todavía.<br><br><button class="btn p" onclick="M.edit(\''+c+'\')">+ Añadir '+E(SCH[c].t.toLowerCase())+'</button></div>';
  h+='<div class="tw"><table class="t"><thead><tr>'+COLS[c].map(function(col){return '<th>'+E(col[0])+'</th>';}).join('')+'<th></th></tr></thead><tbody>'+arr.map(function(x){return '<tr class="click" style="'+(x._arch?'opacity:.55':'')+'" onclick="M.edit(\''+c+'\',\''+x.id+'\')">'+COLS[c].map(function(col){return '<td>'+col[1](x)+'</td>';}).join('')+'<td onclick="event.stopPropagation()">'+(x._arch?'<button class="btn sm" onclick="M.restore(\''+c+'\',\''+x.id+'\')">Recuperar</button>':'')+'</td></tr>';}).join('')+'</tbody></table></div>';
  return h;
}
function vEmp(){
  var o=get('empresa','main');
  var h='<div class="row" style="margin-bottom:12px"><h1 class="h1">Mi empresa</h1><span class="sp"></span><button class="btn p" onclick="M.edit(\'empresa\')">'+(o?'Editar':'Configurar')+'</button></div>';

/* ── Importar CSV / Excel pegado ── */
M.importar=function(c){
  var fl=[];SCH[c].sec.forEach(function(s){s.f.forEach(function(f){if(f.t!=='ref'&&f.t!=='chk')fl.push(f);});});
  openDr('Importar '+SCH[c].t.toLowerCase()+'s','<div class="sec"><p class="small" style="margin-top:0">Pega filas desde Excel o un CSV. La primera fila debe tener los encabezados. Columnas reconocidas:</p><p class="mini">'+fl.map(function(f){return E(f.l);}).join(' · ')+'</p><textarea class="in" id="impT" style="min-height:220px" placeholder="'+E(fl.slice(0,4).map(function(f){return f.l;}).join('\t'))+'"></textarea><div class="mini" id="impI" style="margin-top:6px"></div></div>',
   '<button class="btn p" id="impOk">Importar</button><button class="btn" onclick="M.closeDr()">Cancelar</button>');
  $('impOk').onclick=function(){
    var txt=$('impT').value.trim();if(!txt)return;var lines=txt.split(/\r?\n/).filter(function(l){return l.trim();}),sep=lines[0].indexOf('\t')>=0?'\t':lines[0].indexOf(';')>=0?';':',';
    var split=function(l){var out=[],cur='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===sep&&!q){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out.map(function(x){return x.trim();});};
    var norm=function(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');};
    var hd=split(lines[0]).map(function(x){var n=norm(x);return fl.find(function(f){return norm(f.l)===n||norm(f.k)===n||norm(f.l).indexOf(n)===0&&n.length>3;});});
    if(!hd.some(Boolean)){$('impI').textContent='No se reconoce ningún encabezado.';return;}
    var n=0;lines.slice(1).forEach(function(l){var v=split(l),o={};hd.forEach(function(f,i){if(f&&v[i]){o[f.k]=f.t==='num'?Number(String(v[i]).replace(',','.')):v[i];}});if(Object.keys(o).length){if(c==='choferes'||c==='vehiculos')o.activo=true;save(c,o,true);n++;}});
    render();M.closeDr();toast(n+' registros importados');
  };
};

})();
